[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rtsolis200-costledger"
version = "0.1.0"
description = "按调用记录归集 token 与费用，区分输入输出与缓存命中，给出日度与月度汇总。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rtsolis200" }]
keywords = ["cost", "billing", "tokens", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rtsolis200.github.io"
Repository = "https://github.com/rtsolis200/costledger"
Issues = "https://github.com/rtsolis200/costledger/issues"

[project.scripts]
costledger = "costledger:main"

[tool.setuptools]
py-modules = ["costledger"]
